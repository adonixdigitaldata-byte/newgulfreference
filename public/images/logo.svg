<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 130" width="100%" height="100%" fill="none">
  <defs>
    <style>
      .brand-title {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 800;
        font-size: 38px;
        fill: #0B60D8;
        letter-spacing: 0.12em;
      }
      .brand-tagline {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 600;
        font-size: 17px;
        fill: #0B60D8;
        letter-spacing: 0.38em;
      }
    </style>
  </defs>

  <!-- Helix Wave Icon -->
  <g transform="translate(10, 15)">
    <!-- Left arch -->
    <path d="M 15 62 C 30 22, 65 16, 90 42 C 105 58, 118 78, 138 88 C 160 98, 185 88, 198 62" 
          stroke="#0B60D8" stroke-width="14" stroke-linecap="round" fill="none" />
    
    <!-- Right arch & loop cross -->
    <path d="M 68 62 C 82 88, 108 98, 130 88 C 150 78, 162 58, 178 42 C 200 20, 235 30, 248 62" 
          stroke="#0B60D8" stroke-width="14" stroke-linecap="round" fill="none" />

    <!-- Center Loop closure strand -->
    <path d="M 88 42 C 102 20, 132 18, 152 38" 
          stroke="#0B60D8" stroke-width="14" stroke-linecap="round" fill="none" />

    <!-- 3 DNA base bars -->
    <line x1="120" y1="42" x2="120" y2="72" stroke="#0B60D8" stroke-width="6" stroke-linecap="round" />
    <line x1="133" y1="36" x2="133" y2="78" stroke="#0B60D8" stroke-width="6" stroke-linecap="round" />
    <line x1="146" y1="42" x2="146" y2="72" stroke="#0B60D8" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Typography -->
  <text x="295" y="65" class="brand-title">GULF M REFERENCE</text>
  <text x="298" y="96" class="brand-tagline">HEALTH MATTERS</text>
</svg>
